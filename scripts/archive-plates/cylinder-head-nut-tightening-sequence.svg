<text x="80" y="1100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#5b6169">Redrawn for legibility from the Rover Mini workshop manual engine section, fig. 12M0143. Torque values apply to the 1275 A+ nine-stud head.</text>
<text x="80" y="1126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#5b6169">Other A-series engines, including the 998 A+, use different figures &#8212; check the torque chart first.</text>
