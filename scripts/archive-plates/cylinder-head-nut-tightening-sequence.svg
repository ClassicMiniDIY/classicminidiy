<text x="800" y="838" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-style="italic" fill="#5b6169">The order works outwards from the centre of the head &#8212; nut 1 is central, 8 and 9 are the end nuts.</text>
<rect x="80" y="878.0" width="1440" height="176.0" rx="10" fill="#fbfaf7" stroke="#c7ccd1" stroke-width="2"/>
<rect x="80" y="878.0" width="6" height="176.0" rx="3" fill="#6b7a52"/>
<text x="118" y="918" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6b7a52" letter-spacing="2.2">PROCEDURE</text>
<text x="118" y="956" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#1c1f24">Lightly oil the cylinder head stud threads, then fit all nuts finger tight.</text>
<text x="118" y="988" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#1c1f24">Tighten progressively in the order shown, in two passes over the full sequence.</text>
<text x="118" y="1023" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#5b6169">Metric figures are as published in the source; imperial equivalents are converted.</text>
<rect x="940" y="908" width="272" height="116" rx="8" fill="#ffffff" stroke="#c7ccd1" stroke-width="2"/>
<text x="1076" y="936" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6b7a52" letter-spacing="2">FIRST PASS</text>
<text x="1076" y="982" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1c1f24">34 Nm</text>
<text x="1076" y="1008" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#5b6169">25 lb-ft</text>
<rect x="1232" y="908" width="272" height="116" rx="8" fill="#ffffff" stroke="#c7ccd1" stroke-width="2"/>
<text x="1368" y="936" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#6b7a52" letter-spacing="2">FINAL PASS</text>
<text x="1368" y="982" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1c1f24">68 Nm</text>
<text x="1368" y="1008" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#5b6169">50 lb-ft</text>
