<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-label="Cylinder head nut tightening sequence for the A-series nine-stud head">
<title>Cylinder Head Nut Tightening Sequence — A-Series Nine-Stud Head</title>
<desc>Plan view of an A-series cylinder head showing the nine stud nut positions numbered in tightening order: bottom row left to right 8, 4, 1, 5, 9; top row left to right 6, 2, 3, 7. Tighten progressively in that order to 34 Nm (25 lb-ft), then finally to 68 Nm (50 lb-ft).</desc>
