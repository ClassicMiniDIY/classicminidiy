name: E2E Nightly

# Browser tests run on a schedule, not on every PR. Two reasons: a browser
# download plus a dev-server boot is several minutes of Actions time per PR,
# and a flaky browser test must never be the thing that blocks a merge. The
# cheap, deterministic checks (unit + tests/static + the route crawler) gate
# PRs instead; this catches what only a real browser can see.
on:
  schedule:
    # 07:15 UTC — after the overnight deploys, before the working day.
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      crawl_production:
        description: 'Also crawl the live site'
        type: boolean
        default: true

# Least privilege — see the note in pr-check.yml. `actions/upload-artifact@v4`
# uses the runtime token rather than GITHUB_TOKEN, so the report upload needs
# nothing beyond read here.
permissions:
  contents: read

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  browser:
    name: Playwright (chromium + firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Prepare Nuxt types
        run: bunx nuxi prepare

      # Firefox is not redundant coverage. The nav dropdown hydration bug
      # reproduced ONLY in Firefox — every Chromium verification passed while
      # it was still broken, which is why it survived being "fixed" repeatedly.
      - name: Install browsers
        run: bunx playwright install --with-deps chromium firefox

      - name: Run E2E
        run: bunx playwright test
        env:
          # The dev server's SSR worker OOMs partway through a two-browser run
          # at the default heap, after which every route 500s and the remaining
          # failures are noise. Measured, not guessed.
          NODE_OPTIONS: '--max-old-space-size=8192'
          NUXT_PUBLIC_EXCHANGE_ENABLED: ${{ secrets.NUXT_PUBLIC_EXCHANGE_ENABLED }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Turns on tests/e2e/authenticated.spec.ts, which is the only place
          # the suite can observe a hydration mismatch at all: signed out, the
          # server and the client agree on `isAuthenticated` and no mismatch can
          # occur. The specs skip themselves when this is unset, so a clean
          # checkout still runs the anonymous suite with no credentials.
          #
          # There is deliberately no password secret. This site has no password
          # auth — magic link, OAuth and passkey only — so the session is minted
          # with the service role instead. See tests/e2e/_auth.ts.
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  production-routes:
    name: Crawl production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || inputs.crawl_production

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The crawler is dependency-free by design — it needs the repo for the
      # route manifest and nothing else, so there is no install step here.
      # Crawling the LIVE site is what catches the class of defect that only
      # appears with the production build and real data: an empty schema.org
      # graph after a module bump, a detail page that 500s on one record, a
      # redirect that stopped firing at the zone edge.
      - name: Crawl https://www.classicminidiy.com
        run: node scripts/smoke-routes.mjs https://www.classicminidiy.com --concurrency 3

  # Separate job on purpose. These assert LIVE infrastructure — ~30 real
  # requests plus a Cloudflare API call — so a transient 5xx or a rate-limited
  # API response is not evidence about the site's routes. Sharing a job with the
  # production crawl would let an infra blip fail the crawl's result too, and a
  # nightly that goes red for unrelated reasons is a nightly people stop reading.
  infrastructure:
    name: Verify Cloudflare zone rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || inputs.crawl_production

    steps:
      - uses: actions/checkout@v6

      # Asserts the Cloudflare zone WAF rule that blocks AI TRAINING crawlers
      # while letting the ANSWER bots through — the split the GEO work depends
      # on, since blocking OAI-SearchBot or PerplexityBot costs citations.
      # Needs no credentials: it is user-agent probing over plain HTTP.
      - name: Verify the AI-crawler firewall rule
        run: bash scripts/verify-ai-crawler-firewall.sh https://www.classicminidiy.com

      # Asserts the zone rate-limit rules that stand in for BotID, which is
      # stubbed on Cloudflare and classifies nothing. The script derives the
      # routes needing coverage from the SOURCE, so a new checkBotId() call
      # fails this until the zone rule is extended.
      #
      # If this reports it cannot read the ruleset, the deploy token is scoped
      # to Workers only and needs Zone -> Read added; it is read-only either way.
      - name: Verify the stubbed-BotID zone rate-limit rules
        run: python3 scripts/verify-cf-ratelimit.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
