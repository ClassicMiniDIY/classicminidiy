name: Deploy to Cloudflare Workers

# Phase 2: manual only. There is no `push` trigger, because production still
# runs on Vercel — this deploys to workers.dev so the migration can be exercised
# without touching live traffic. Phase 4 adds the push-to-main trigger, and even
# then the actual platform switch is a DNS/proxy change, not this workflow.
on:
  workflow_dispatch:
    inputs:
      site_env:
        description: 'preview = noindex + no image transforms (safe). production = the real zone deploy.'
        type: choice
        options: [preview, production]
        default: preview
      dry_run:
        description: 'Build and report bundle size without deploying'
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build for Cloudflare Workers
        env:
          NITRO_PRESET: cloudflare_module
          # MANDATORY. Node caps its own heap well below the runner's RAM, so
          # this is required regardless of runner size. 6144 is NOT enough for
          # this repo — it OOMs with `Reached heap limit`. Measured, not guessed.
          NODE_OPTIONS: --max-old-space-size=8192
          # MANDATORY while this deploys to a PUBLIC workers.dev URL. Without it
          # nuxt-robots emits the indexable variant, and because
          # NUXT_PUBLIC_SUPABASE_* is build-baked the result is a crawlable,
          # fully functional mirror of the site reading PRODUCTION data — a
          # duplicate-content hazard on a site where SEO is load-bearing, and a
          # second unmonitored public front-end. verify-cf-deploy.sh asserts the
          # noindex, so removing this fails the smoke test rather than shipping
          # silently.
          #
          # It ALSO gates the Cloudflare image provider, which is zone-only.
          # Both default to the preview/safe behaviour when unset, so a mistake
          # here degrades (unoptimized images, noindex) rather than breaking.
          #
          # Driven by the workflow input so a production deploy is an explicit,
          # auditable choice rather than a default someone forgot to change.
          NUXT_SITE_ENV: ${{ inputs.site_env }}
        run: bun run build

      # routeRules and definePageMeta redirects are prerendered as meta-refresh
      # HTML. On Vercel the platform's routing shadows them and the real 301 is
      # served; on Workers the STATIC ASSET LAYER WINS, so the file is served
      # directly and the redirect silently degrades to a 200 carrying a refresh.
      # Measured before this step existed: /archive/manuals returned 200 +
      # meta-refresh on the worker while production returned a 301.
      - name: Strip prerendered meta-refresh artifacts
        run: ./scripts/strip-meta-refresh-artifacts.sh .output/public

      - name: Report bundle size
        run: bunx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A production deploy is verified against the real origin, where the
      # zone-dependent checks (image transforms, HSTS, indexability) actually arm.
      # A preview deploy is verified against workers.dev, where they skip.
      # workers.dev is disabled since the cutover (it served an indexable second
      # copy of production), so there is no preview hostname to smoke-test any
      # more. A preview build is verified by the build + dry-run steps above; use
      # `wrangler versions upload` if a real preview URL is needed.
      - name: Smoke-test the deployment
        if: ${{ !inputs.dry_run && inputs.site_env == 'production' }}
        run: ./scripts/verify-cf-deploy.sh https://www.classicminidiy.com
