name: Deploy to Cloudflare Workers

# Cloudflare is production, so a merge to main deploys. This was the one Phase 4
# item that never landed: the workflow stayed `workflow_dispatch`-only from the
# Phase 2 era, when production was still Vercel and this only pushed to
# workers.dev. The cutover happened, workers.dev was disabled, and the smoke
# test already points at www.classicminidiy.com — but nothing ever triggered it,
# so merges to main sat undeployed.
#
# `workflow_dispatch` is kept for preview builds, dry runs and re-deploys.
on:
  push:
    branches: [main]
    # Docs and markdown are not part of the built site — there is no `content/`
    # directory and nothing renders repo markdown — so a docs-only commit does
    # not need a 30-minute build. Anything that can change the site is NOT
    # listed here. If you ever add rendered markdown content, drop this.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      site_env:
        description: 'preview = noindex + no image transforms (safe). production = the real zone deploy.'
        type: choice
        options: [preview, production]
        default: preview
      dry_run:
        description: 'Build and report bundle size without deploying'
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  # Gate the deploy on the same suite the PR check runs. A merge is normally
  # already green from its PR, but this also covers a direct push to main and a
  # merge whose result differs from what was tested in isolation.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Not --frozen-lockfile, for the same bun.lockb/bun.lock transition reason
      # documented in pr-check.yml.
      - name: Install dependencies
        run: bun install

      # tsconfig.json extends the generated .nuxt/tsconfig.json, which is not
      # committed and is not produced by this repo's overridden postinstall.
      # Without this every test file fails to load. See pr-check.yml.
      - name: Prepare Nuxt types
        run: bunx nuxi prepare

      - name: Run tests
        run: bun run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `inputs.*` are EMPTY on a push event, so these cannot be read directly in
    # the steps below. Resolved once here instead:
    #
    #   NUXT_SITE_ENV — a push to main is a production deploy. Falling through
    #   to the unset default would have been actively harmful: unset means the
    #   PREVIEW behaviour, i.e. `noindex` plus no image transforms, so every
    #   merge would have published a non-indexable production site.
    #
    #   DRY_RUN — false on push; only a manual run can ask for a dry run.
    env:
      NUXT_SITE_ENV: ${{ inputs.site_env || 'production' }}
      DRY_RUN: ${{ inputs.dry_run == true }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Two different failure modes, so two different checks.
      #
      # BUILD-TIME values are compiled into the artifact. `NUXT_PUBLIC_*` lands
      # in the client bundle and cannot be supplied later, so a build missing
      # them succeeds and deploys a site whose auth and marketplace are silently
      # dead. Fail loudly instead.
      - name: Check build-time secrets are present
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Build-critical too, so guarded here rather than left to degrade: the
          # content keys bake into prerendered HTML, and the og-image secret has
          # to match the one the worker verifies with.
          GITHUB_API_KEY: ${{ secrets.GH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}
        run: |
          missing=()
          for name in NUXT_PUBLIC_SUPABASE_URL NUXT_PUBLIC_SUPABASE_KEY SUPABASE_SERVICE_KEY \
                      GITHUB_API_KEY YOUTUBE_API_KEY NUXT_OG_IMAGE_SECRET; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required build-time secrets: ${missing[*]}"
            echo "Add them under Settings > Secrets and variables > Actions."
            echo "Without them the build either fails on the sitemap sources or,"
            echo "worse, succeeds and ships a site with auth and /exchange dead."
            exit 1
          fi
          echo "All required build-time secrets are present."

      # RUNTIME values are Cloudflare Worker secrets, read by Nitro's env
      # override at request time. They are deliberately NOT in the build env any
      # more — that is the whole point of this split. But the earlier failure
      # mode was the runtime half being absent entirely while every build quietly
      # baked in an empty string, so absence has to be checked, not assumed.
      # This asserts the NAMES exist; it never reads a value.
      - name: Check runtime secrets exist on the worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          names=$(bunx wrangler secret list --format json | jq -r '.[].name' | sort)
          echo "Worker has $(echo "$names" | grep -c . ) secret(s)."
          missing=()
          for want in NUXT_SUPABASE_SERVICE_KEY \
                      NUXT_LANGGRAPH_API_URL NUXT_LANGSMITH_API_KEY \
                      NUXT_GITHUB_API_KEY NUXT_YOUTUBE_API_KEY \
                      NUXT_MCP_API_KEY \
                      NUXT_MARKETING_UNSUB_SECRET NUXT_MARKETING_ADMIN_EMAILS \
                      NUXT_S3_MODELS_BUCKET NUXT_S3_MODELS_REGION \
                      NUXT_S3_MODELS_ACCESS_KEY_ID NUXT_S3_MODELS_SECRET_ACCESS_KEY; do
            grep -qx "$want" <<< "$names" || missing+=("$want")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Worker is missing runtime secrets: ${missing[*]}"
            echo "Set them with ./scripts/set-cf-secrets.sh (run locally, reads your .env)."
            echo "A missing one is an empty string at runtime, not an error -- which is"
            echo "how the 2026-08-26 chat outage shipped green."
            exit 1
          fi
          echo "All required runtime secrets are present on the worker."

      - name: Build for Cloudflare Workers
        env:
          NITRO_PRESET: cloudflare_module

          # Supabase: the sitemap sources prerender through getServiceClient(),
          # and the public pair is baked into the client bundle.
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

          # Baked into the client bundle. A missing one degrades a feature
          # silently rather than failing, which is why they are all listed
          # rather than left to defaults.
          NUXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NUXT_PUBLIC_MAPBOX_ACCESS_TOKEN }}
          NUXT_PUBLIC_STRIPE_PORTAL_URL: ${{ secrets.NUXT_PUBLIC_STRIPE_PORTAL_URL }}
          NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NUXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NUXT_PUBLIC_LANGGRAPH_ASSISTANT_ID: ${{ secrets.NUXT_PUBLIC_LANGGRAPH_ASSISTANT_ID }}
          NUXT_PUBLIC_EXCHANGE_ENABLED: ${{ secrets.NUXT_PUBLIC_EXCHANGE_ENABLED }}
          NUXT_PUBLIC_MODELS_ENABLED: ${{ secrets.NUXT_PUBLIC_MODELS_ENABLED }}
          POSTHOG_PUBLIC_KEY: ${{ secrets.POSTHOG_PUBLIC_KEY }}

          # Everything else server-side is now a CLOUDFLARE RUNTIME SECRET and is
          # deliberately absent here — see scripts/set-cf-secrets.sh and the
          # "Build-time vs runtime secrets" section in CLAUDE.md. Adding one back
          # would re-bake it into the bundle and undo the split.
          #
          # These two are the exception: they are read at BUILD time as well as at
          # runtime, because crawlLinks prerenders pages that fetch
          # /api/{github,youtube}/*. Unset here bakes an empty widget into static
          # HTML, which no runtime secret can repair.
          #
          # `GITHUB_*` secret names are reserved by Actions, so the Actions secret
          # is GH_API_KEY. The runtimeConfig key is GITHUB_API_KEY.
          GITHUB_API_KEY: ${{ secrets.GH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

          # MUST match the worker's NUXT_OG_IMAGE_SECRET. nuxt-og-image resolves
          # its signing secret at BUILD time and falls back to a RANDOM
          # per-build one when this is unset, so every og:image URL baked into
          # prerendered HTML would be signed with a throwaway key. The worker
          # verifies against its own secret and answers 403 "Invalid URL
          # signature" for all of them. Build and runtime have to agree.
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}
          # MANDATORY. Node caps its own heap well below the runner's RAM, so
          # this is required regardless of runner size. 6144 is NOT enough for
          # this repo — it OOMs with `Reached heap limit`. Measured, not guessed.
          NODE_OPTIONS: --max-old-space-size=8192
          # MANDATORY while this deploys to a PUBLIC workers.dev URL. Without it
          # nuxt-robots emits the indexable variant, and because
          # NUXT_PUBLIC_SUPABASE_* is build-baked the result is a crawlable,
          # fully functional mirror of the site reading PRODUCTION data — a
          # duplicate-content hazard on a site where SEO is load-bearing, and a
          # second unmonitored public front-end. verify-cf-deploy.sh asserts the
          # noindex, so removing this fails the smoke test rather than shipping
          # silently.
          #
          # It ALSO gates the Cloudflare image provider, which is zone-only.
          # Both default to the preview/safe behaviour when unset, so a mistake
          # here degrades (unoptimized images, noindex) rather than breaking.
          #
          # Resolved at job level (see the `env:` block above) because a push
          # event carries no `inputs`. A manual run still chooses explicitly;
          # a merge to main is always production.
        run: bun run build

      # routeRules and definePageMeta redirects are prerendered as meta-refresh
      # HTML. On Vercel the platform's routing shadows them and the real 301 is
      # served; on Workers the STATIC ASSET LAYER WINS, so the file is served
      # directly and the redirect silently degrades to a 200 carrying a refresh.
      # Measured before this step existed: /archive/manuals returned 200 +
      # meta-refresh on the worker while production returned a 301.
      - name: Strip prerendered meta-refresh artifacts
        run: ./scripts/strip-meta-refresh-artifacts.sh .output/public

      - name: Report bundle size
        run: bunx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: env.DRY_RUN != 'true'
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A production deploy is verified against the real origin, where the
      # zone-dependent checks (image transforms, HSTS, indexability) actually arm.
      # A preview deploy is verified against workers.dev, where they skip.
      # workers.dev is disabled since the cutover (it served an indexable second
      # copy of production), so there is no preview hostname to smoke-test any
      # more. A preview build is verified by the build + dry-run steps above; use
      # `wrangler versions upload` if a real preview URL is needed.
      - name: Smoke-test the deployment
        if: env.DRY_RUN != 'true' && env.NUXT_SITE_ENV == 'production'
        run: ./scripts/verify-cf-deploy.sh https://www.classicminidiy.com
