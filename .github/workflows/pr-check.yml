name: PR Check

on:
  pull_request:
    branches: [main]

# Least privilege. Nothing here writes to the repo — it installs, tests and
# crawls a dev server — so the read scope is all it needs. Set explicitly rather
# than inherited: the repository default is configured outside these files and
# can change without any of them changing, which leaves the scope a job runs
# with invisible in the code that runs. (CodeQL actions/missing-workflow-permissions.)
permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Not --frozen-lockfile: the repo is mid-transition from bun.lockb to the
      # text bun.lock, and a frozen install fails while both states are in play.
      - name: Install dependencies
        run: bun install

      # Required: tsconfig.json extends ./.nuxt/tsconfig.json, which is
      # generated rather than committed (.nuxt is gitignored). This repo has no
      # `postinstall: nuxt prepare`, so `bun install` never generates it and
      # .nuxt is absent on a fresh checkout. Without this step every test file
      # fails to load with `Cannot find module './.nuxt/tsconfig.json'` — 147
      # files, 0 tests run.
      # It passes locally only because .nuxt lingers from `bun run dev`.
      - name: Prepare Nuxt types
        run: bunx nuxi prepare

      # Includes tests/unit/data/needles-data-integrity.test.ts, which pins the
      # canonical hash of data/needles.json. The Android and iOS repos pin the
      # same hash, so a drifted copy fails CI in whichever repo drifted.
      #
      # Also includes tests/static/**, which enforces the invariants no unit test
      # can see: i18n locale completeness, hydration-safe auth branches, the
      # client-to-server API contract, dynamic-route 404s, and the plain Worker
      # env registry. Each carries a SHRINK-ONLY allowlist of today's known
      # violations, so a new one fails and a fix that forgets to remove its
      # entry also fails.
      # test:coverage rather than test: it runs the SAME suite and additionally
      # enforces the thresholds in vitest.config.ts, for 7 seconds more (34s vs
      # 27s locally). A separate coverage job would have run every test twice.
      #
      # The thresholds gate the depth of tested code, not the breadth of the
      # codebase — `all` is off, so the report covers only files a test imports.
      # The reasoning is in vitest.config.ts; read it before reacting to the
      # number.
      - name: Run tests (with coverage thresholds)
        run: bun run test:coverage

      # Catches a local declaration that shadows a Nuxt auto-import. unimport
      # skips injecting any name it thinks is already provided and does no scope
      # analysis, so one `const ref = ...` inside a callback strips the
      # top-level `ref` import for the WHOLE file and every setup-scope `ref()`
      # throws at runtime. Nothing fails at build time; the component simply
      # never mounts. This took the SU needle configurator down for months.
      - name: Check for shadowed auto-imports
        run: python3 scripts/find-shadowed-autoimports.py

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 0 is required by format:check, which diffs against the
      # MERGE BASE with the base branch. actions/checkout defaults to a shallow
      # clone with no other refs, so `git merge-base origin/main HEAD` cannot
      # resolve and the script exits 2 rather than silently checking nothing.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Ratchet, not a gate: the first run reported 1,239 errors across 263
      # never-type-verified .vue files, and a check that is red before anyone
      # touches anything teaches people to ignore checks. This fails when an
      # area's count goes UP, and equally when it goes DOWN without the baseline
      # in scripts/typecheck.mjs being lowered — so ground gained cannot be
      # quietly given back. `nuxi prepare` is not optional: tsconfig.json
      # extends the generated .nuxt/tsconfig.json and .nuxt is gitignored.
      - name: Typecheck (ratcheted)
        run: bun run typecheck

      # Scoped to the files the PR changed. Repo-wide `prettier --check` fails
      # on 225 existing files, and the repo rule forbids `bun run format` on a
      # branch (it rewrites hundreds of untouched files), so the diff is the
      # only honest scope.
      - name: Format check (changed files)
        run: node scripts/format-check.mjs "origin/${{ github.base_ref }}"

  routes:
    name: Route Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Prepare Nuxt types
        run: bunx nuxi prepare

      # Runs against `nuxi dev` rather than a production build on purpose: the
      # build needs ~8 GB and 5+ minutes, which is not worth paying on every PR
      # when the defects this catches (SSR 500s, soft-404s, empty schema.org
      # blocks, hijacked redirects, untranslated keys rendering as raw paths)
      # all reproduce in dev. The same crawler runs against the real built
      # artifact in deploy-cloudflare.yml, where the build already exists.
      - name: Start dev server
        run: |
          NODE_OPTIONS=--max-old-space-size=8192 bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
        env:
          NUXT_PUBLIC_EXCHANGE_ENABLED: ${{ secrets.NUXT_PUBLIC_EXCHANGE_ENABLED }}
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Wait for the server
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "dev server up after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "dev server never became ready:"
          tail -50 /tmp/dev-server.log
          exit 1

      - name: Crawl every route
        # --strict promotes warnings to failures. Safe to turn on now that the
        # heading, canonical, schema.org and raw-i18n-key checks are all clean —
        # before this, ten <h1> warnings would have blocked every PR. Keeping it
        # on is what stops that backlog rebuilding.
        run: bun run test:routes http://localhost:3000 --concurrency 3 --strict

      - name: Dev server log on failure
        if: failure()
        run: tail -100 /tmp/dev-server.log

      - name: Stop dev server
        if: always()
        run: kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true
